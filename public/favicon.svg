<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0" />
    </radialGradient>
    <filter id="blurFilter">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="22" fill="#050508"/>
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  
  <!-- Radar Rings -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.15"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Crosshairs -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="#00ffff" stroke-width="0.8" opacity="0.2"/>
  <line x1="10" y1="50" x2="90" y2="50" stroke="#00ffff" stroke-width="0.8" opacity="0.2"/>
  
  <!-- Center Dot with Glow -->
  <circle cx="50" cy="50" r="5" fill="#00ffff" filter="url(#blurFilter)" opacity="0.4"/>
  <circle cx="50" cy="50" r="2.5" fill="#00ffff"/>
  
  <!-- "Blip" / Detected Host -->
  <circle cx="70" cy="35" r="3" fill="#ff00ff" filter="url(#blurFilter)" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="70" cy="35" r="1.5" fill="#ff00ff"/>
  
  <!-- Scanning Sweep (Visual representation) -->
  <path d="M50 50 L50 12 A38 38 0 0 1 82.9 28.5 Z" fill="#00ffff" opacity="0.1">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite" />
  </path>
</svg>